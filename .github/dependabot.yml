# Patch updates only for the Gradle build: minor and major upgrades of the versions in
# gradle/libs.versions.toml are made deliberately, because they can affect compatibility
# and the release notes of Pulsar.
#
# A Gradle update usually changes the jars that the binary distributions bundle, which fails
# checkBinaryLicense in CI. A committer updates the pull request with:
#   ./gradlew updateBinaryLicense && ./gradlew checkBinaryLicense
# and pushes the LICENSE/NOTICE changes to the Dependabot branch.
#
# The commit message prefixes end with a space, so that Dependabot does not add a colon
# after them and the pull request titles match the [type][scope] format that
# .github/workflows/ci-semantic-pull-request.yml checks.
#
# An update of gradle/actions can only run after its commit is in
# https://github.com/apache/infrastructure-actions/blob/main/approved_patterns.yml

version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "[improve][build] "
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      # OpenTelemetry releases each *-alpha artifact together with its stable line, at the same
      # version plus "-alpha" (opentelemetry and opentelemetry-alpha, and
      # opentelemetry-instrumentation and opentelemetry-instrumentation-alpha in
      # gradle/libs.versions.toml). Updating them in one pull request keeps the versions in sync;
      # the root build.gradle.kts fails when they differ.
      opentelemetry:
        patterns:
          - "io.opentelemetry:*"
          - "io.opentelemetry.instrumentation:*"

  # The composite actions in .github/actions also reference actions
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[improve][ci] "
