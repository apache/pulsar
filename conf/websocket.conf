### --- Web Socket proxy settings --- ###

# Configuration Store connection string
configurationMetadataStoreUrl=

# Metadata store session timeout in milliseconds
metadataStoreSessionTimeoutMillis=30000

# Metadata store cache expiry time in seconds
metadataStoreCacheExpirySeconds=300

# Pulsar cluster url to connect to broker (optional if configurationStoreServers present)
serviceUrl=
serviceUrlTls=
brokerServiceUrl=
brokerServiceUrlTls=

# Port to use to server HTTP request
webServicePort=8080
# Port to use to server HTTPS request
webServicePortTls=

# Path for the file used to determine the rotation status for the proxy-instance when responding
# to service discovery health checks
statusFilePath=

# Hostname or IP address the service binds on, default is 0.0.0.0.
bindAddress=0.0.0.0

# Enable or disable the use of HA proxy protocol for resolving the client IP for http/https requests.
webServiceHaProxyProtocolEnabled=false

# Trust X-Forwarded-For header for resolving the client IP for http/https requests. Default is false.
webServiceTrustXForwardedFor=false

# Add detailed client/remote and server/local addresses and ports to http/https request logging.
# Defaults to true when either webServiceHaProxyProtocolEnabled or webServiceTrustXForwardedFor is enabled.
webServiceLogDetailedAddresses=

# Name of the pulsar cluster to connect to
clusterName=

# Number of IO threads in Pulsar Client used in WebSocket proxy
webSocketNumIoThreads=

# Number of threads used by Websocket service
webSocketNumServiceThreads=

# Number of threads to use in HTTP server. Default is Runtime.getRuntime().availableProcessors()
numHttpServerThreads=

# Number of connections per Broker in Pulsar Client used in WebSocket proxy
webSocketConnectionsPerBroker=

# Memory limit in MBs for direct memory in Pulsar Client used in WebSocket proxy
webSocketPulsarClientMemoryLimitInMB=0

# Time in milliseconds that idle WebSocket session times out
webSocketSessionIdleTimeoutMillis=300000

# The maximum size of a text message during parsing in WebSocket proxy
webSocketMaxTextFrameSize=1048576

# Capacity for thread pool queue in the HTTP server
httpServerThreadPoolQueueSize=8192

# Capacity for accept queue in the HTTP server
httpServerAcceptQueueSize=8192

# Maximum number of inbound http connections. (0 to disable limiting)
maxHttpServerConnections=2048

# Max concurrent web requests
maxConcurrentHttpRequests=1024

### --- Authentication --- ###

# Enable authentication
authenticationEnabled=false

# Authentication provider name list, which is comma separated list of class names
authenticationProviders=

# Enforce authorization
authorizationEnabled=false

# Authorization provider fully qualified class-name
authorizationProvider=org.apache.pulsar.broker.authorization.PulsarAuthorizationProvider

# Allow wildcard matching in authorization
# (wildcard matching only applicable if wildcard-char:
# * presents at first or last position eg: *.pulsar.service, pulsar.service.*)
authorizationAllowWildcardsMatching=false

# Role names that are treated as "super-user", meaning they will be able to do all admin
# operations and publish/consume from all topics
superUserRoles=

# Authentication settings of the proxy itself. Used to connect to brokers
brokerClientTlsEnabled=false
brokerClientAuthenticationPlugin=
brokerClientAuthenticationParameters=
brokerClientTrustCertsFilePath=

# Whether the hostname is validated when connecting to the broker.
# Enabled by default since Pulsar 5.0 (PIP-478).
tlsHostnameVerificationEnabled=true

# You can add extra configuration options for the Pulsar Client
# by prefixing them with "brokerClient_". These configurations are applied after hard coded configuration
# and before the above brokerClient configurations named above.

# When this parameter is not empty, unauthenticated users perform as anonymousUserRole
anonymousUserRole=

### --- TLS --- ###
## Note that some of the above TLS configs also apply to the KeyStore TLS configuration.

# Deprecated - use webServicePortTls and brokerClientTlsEnabled instead
tlsEnabled=false

# Accept untrusted TLS certificate from client
tlsAllowInsecureConnection=false

# Path for the TLS certificate file
tlsCertificateFilePath=

# Path for the TLS private key file
tlsKeyFilePath=

# Path for the trusted TLS certificate file
tlsTrustCertsFilePath=

# Specify whether Client certificates are required for TLS
# Reject the Connection if the Client Certificate is not trusted.
tlsRequireTrustedClientCertOnConnect=false

# Tls cert refresh duration in seconds. Set 0 to disable the background rotation check, so the
# TLS material loaded at startup is kept until restart.
tlsCertRefreshCheckDurationSec=300

# PIP-478 TLS factory (PulsarTlsFactory) class name for the WebSocket proxy's web server TLS (purpose WEB).
# When set, the new PIP-478 TLS SPI is used instead of the built-in file-based TLS loading: an empty value
# or the literal 'default' selects the built-in default factory composed from these tls* settings, otherwise
# the named class is instantiated via its public no-arg constructor.
tlsFactoryClassName=

# PIP-478 configuration parameters for tlsFactoryClassName (JSON object or comma-separated key=value list)
tlsFactoryConfig=

# PIP-478 TLS factory (PulsarTlsFactory) class name for the WebSocket proxy's own outbound
# (websocket-to-broker) client connections (purpose BROKER_CLIENT). An empty value or the literal 'default'
# selects the built-in default factory composed from the broker-client tls* settings, otherwise the named
# class is instantiated via its public no-arg constructor.
brokerClientTlsFactoryClassName=

# PIP-478 configuration parameters for brokerClientTlsFactoryClassName (JSON object or comma-separated
# key=value list)
brokerClientTlsFactoryConfig=

# Specify the TLS provider for the WebSocket: SunJSSE, Conscrypt and etc.
# Leave unset (the default) to use Conscrypt when it is available on this platform, else the JVM's
# default provider; a configured name is pinned and startup fails if it cannot be resolved. Conscrypt
# ships native libraries for x86_64 and, since 2.6.1, aarch64 — but not for every platform, which is why
# the default falls back instead of failing where it cannot load; pinning it explicitly there does fail.
tlsProvider=

# PIP-478: name of a JSSE (SSLContext) java.security.Provider used to build the WebSocket proxy's web-service
# TLS SSLContext, e.g. BCJSSE for FIPS (with the BC-FIPS crypto provider registered separately). A distinct
# axis from tlsProvider (the JDK-vs-OpenSSL engine switch): when set, the default factory builds the JDK
# engine with this provider as the SSLContext provider, overriding the engine choice. Resolved by preferring a
# provider already registered in the JVM (Security.getProvider), falling back to the ServiceLoader mechanism,
# failing loudly when unresolvable.
# jsseProvider=

# PIP-478: name of a JCA (material) java.security.Provider supplying the KeyStore, CertificateFactory
# and KeyFactory engines that parse the TLS material, e.g. BCFIPS for FIPS alongside jsseProvider=BCJSSE.
# A distinct axis from jsseProvider, which supplies the SSLContext: JSSE service types are never taken
# from this provider. Unset uses the JVM provider search order, i.e. pre-PIP-478 behaviour.
# jcaProvider=

# PIP-478: the Netty SSL engine provider for the WebSocket proxy's OWN OUTBOUND (proxy-to-broker) client
# connections — JDK, OPENSSL or OPENSSL_REFCNT. The tlsProvider key above governs the proxy's web server
# only; this is its outbound counterpart, matching the broker's brokerClientSslProvider. Applied
# independently of brokerClientTlsFactoryClassName.
# brokerClientSslProvider=

# PIP-478: name of a JSSE (SSLContext) java.security.Provider for the WebSocket proxy's OWN OUTBOUND
# (proxy-to-broker) client connections, e.g. BCJSSE for FIPS. The jsseProvider key above governs the
# proxy's web server only; this is its outbound counterpart, matching the broker's
# brokerClientJsseProvider. Applied independently of brokerClientTlsFactoryClassName.
# brokerClientJsseProvider=

# PIP-478: the JCA (material) provider for this component's OWN OUTBOUND client connections — the
# outbound counterpart of jcaProvider, on the same axis. Unset uses the JVM provider search order.
# brokerClientJcaProvider=

# Enable TLS with KeyStore type configuration in WebSocket.
tlsEnabledWithKeyStore=false

# TLS KeyStore type configuration in WebSocket: JKS, PKCS12
tlsKeyStoreType=JKS

# TLS KeyStore path in WebSocket
tlsKeyStore=

# TLS KeyStore password for WebSocket
tlsKeyStorePassword=

# TLS TrustStore type configuration in WebSocket: JKS, PKCS12
tlsTrustStoreType=JKS

# TLS TrustStore path in WebSocket
tlsTrustStore=

# TLS TrustStore password in WebSocket, default value is empty password
tlsTrustStorePassword=

# Specify the tls protocols the proxy's web service will use to negotiate during TLS handshake
# (a comma-separated list of protocol names).
# Examples:
# webServiceTlsProtocols=TLSv1.3,TLSv1.2
webServiceTlsProtocols=

# Specify the tls cipher the proxy will use to negotiate during TLS Handshake
# (a comma-separated list of ciphers).
# Examples:
# webServiceTlsCiphers=TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
webServiceTlsCiphers=

### --- Deprecated config variables --- ###

# Deprecated. Use configurationStoreServers
globalZookeeperServers=

# Deprecated. Use configurationMetadataStoreUrl
configurationStoreServers=

# Zookeeper session timeout in milliseconds
# Deprecated: use metadataStoreSessionTimeoutMillis
zooKeeperSessionTimeoutMillis=-1

# ZooKeeper cache expiry time in seconds
# Deprecated: use metadataStoreCacheExpirySeconds
zooKeeperCacheExpirySeconds=-1

# CryptoKeyReader factory classname to support encryption at websocket.
cryptoKeyReaderFactoryClassName=
