# Docker / Containers
docker-java-core = { module = "com.github.docker-java:docker-java-core", version.ref = "docker-java" }
docker-java-api = { module = "com.github.docker-java:docker-java-api", version.ref = "docker-java" }
docker-java-transport-zerodep = { module = "com.github.docker-java:docker-java-transport-zerodep", version.ref = "docker-java" }

# Kubernetes
kubernetes-client = { module = "io.kubernetes:client-java", version.ref = "kubernetesclient" }

# Servlet
javax-servlet-api = { module = "javax.servlet:javax.servlet-api", version.ref = "javax-servlet-api" }

# Test
testng = { module = "org.testng:testng", version.ref = "testng" }
mockito-core = { module = "org.mockito:mockito-core" }
mockito-inline = { module = "org.mockito:mockito-inline" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj-core" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
restassured = { module = "io.rest-assured:rest-assured", version.ref = "restassured" }
system-lambda = { module = "com.github.stefanbirkner:system-lambda", version.ref = "system-lambda" }
jsonassert = { module = "org.skyscreamer:jsonassert", version.ref = "skyscreamer" }
consolecaptor = { module = "io.github.hakky54:consolecaptor", version.ref = "consolecaptor" }
wiremock = { module = "com.github.tomakehurst:wiremock-jre8", version.ref = "wiremock" }
zstd-jni = { module = "com.github.luben:zstd-jni", version.ref = "zstd-jni" }
lz4-java = { module = "at.yawk.lz4:lz4-java", version.ref = "lz4java" }

# Lombok
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Kafka
kafka-client = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka-client" }

# Debezium
debezium-core = { module = "io.debezium:debezium-core", version.ref = "debezium" }
debezium-connector-mysql = { module = "io.debezium:debezium-connector-mysql", version.ref = "debezium" }
debezium-connector-postgres = { module = "io.debezium:debezium-connector-postgres", version.ref = "debezium" }
debezium-connector-mongodb = { module = "io.debezium:debezium-connector-mongodb", version.ref = "debezium" }
debezium-connector-oracle = { module = "io.debezium:debezium-connector-oracle", version.ref = "debezium" }
debezium-connector-sqlserver = { module = "io.debezium:debezium-connector-sqlserver", version.ref = "debezium" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
