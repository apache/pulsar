# One persistent topic, 500 producer connections, 20 consumers on one Key_Shared subscription.
extends: read-completion-isolation.yaml
load:
  consumerCount: 20
  isolatedConsumers: 20
  consumerIoThreads: 8
  subscriptionType: Key_Shared
  receiverQueueSize: 1000
  messageKeyGenerationMode: random
  batchingEnabled: false
output:
  directory: build/pulsar-profiling/key-shared-500x20
