# VictoriaMetrics' scrape configuration. Each run adds its own in /etc/victoriametrics/runs while it runs: its brokers,
# at the scenario's metrics.intervalSeconds, see docs/metrics.md.
global:
  scrape_interval: 5s
scrape_config_files:
  - /etc/victoriametrics/runs/*.yaml
