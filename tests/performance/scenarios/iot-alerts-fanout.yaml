# Alert fan-out with Shared subscriptions and broker deduplication: a building-management platform's gateways publish
# the alerts of 100,000 devices to one topic, with the broker's deduplication on (cluster-base.yaml), so that a gateway
# that resends after a reconnection doesn't raise an alert twice. Fifty backend applications, such as notification,
# ticketing, an audit log, analytics and a digital twin, each read every alert through a Shared subscription of their
# own, handled by a pool of four stateless worker pods: 250,000 messages per second of dispatch from one topic's
# managed ledger to 200 consumers. A Shared subscription doesn't keep a device's alerts in order, so the applications
# check for lost and duplicated alerts only, and the gateways batch alerts of any device together.
extends: [iot-telemetry-base.yaml, configs/iot-telemetry-high-mem.yaml]
workloads:
  iotTelemetry:
    rate: 5000
    payload:
      size: 256
    devices:
      count: 100000
    gateways:
      count: 20
      producer:
        precreate: true
    topics:
      count: 1
      prefix: persistent://public/default/iot-alerts-
    applications:
      count: 50
      podsPerApplication: 4
      subscriptionPrefix: alert-processor-
      subscriptionType: Shared
