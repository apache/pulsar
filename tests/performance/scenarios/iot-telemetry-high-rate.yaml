# Saturation workload: 500 producer connections feed one topic as fast as possible. Five independent
# applications each consume through a ten-member Key_Shared subscription.
extends: iot-telemetry.yaml
cluster:
  brokers:
    env:
      PULSAR_MEM: -Xms4g -Xmx4g -XX:MaxDirectMemorySize=4g
  bookies:
    env:
      PULSAR_MEM: -Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g
workloads:
  iotTelemetry:
    rate: 0
    warmup:
      seconds: 0
      messages: 500000
      rounds: 2
      roundDelaySeconds: 5
    measurement:
      messages: 5000000
    timeoutSeconds: 600
    devices:
      count: 1000000
    gateways:
      count: 500
      producer:
        ioThreads: 16
        listenerThreads: 16
        maxOutstanding: 100000
        precreate: true
    topics:
      count: 1
    applications:
      count: 5
      podsPerApplication: 10
      client:
        ioThreads: 16
        listenerThreads: 16
