# Saturation workload: 500 producer connections feed one topic as fast as possible. Five independent
# applications each consume through a ten-member Key_Shared subscription.
extends: iot-telemetry.yaml
cluster:
  brokerEnvs:
    PULSAR_MEM: -Xms4g -Xmx4g -XX:MaxDirectMemorySize=4g
  bookkeeperEnvs:
    PULSAR_MEM: -Xms1g -Xmx1g -XX:MaxDirectMemorySize=1g
workloads:
  iotTelemetry:
    rate: 0
    warmupSeconds: 0
    warmupMessages: 500000
    warmupRounds: 2
    warmupRoundDelaySeconds: 5
    numberOfMessages: 5000000
    deviceCount: 1000000
    gatewayCount: 500
    topicCount: 1
    applicationCount: 5
    clientsPerApplication: 10
    ioThreads: 16
    listenerThreads: 16
    maxOutstanding: 100000
    precreateProducers: true
    consumerTimeoutSeconds: 600
