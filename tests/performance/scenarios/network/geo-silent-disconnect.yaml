# The replicators' TCP connections disappear without the remote brokers knowing, as when a NAT gateway or a firewall
# between the regions forgets its connections, 30 s into the measurement: the first cluster's brokers get an error at
# once and reconnect, on new connections, while the remote brokers keep the old ones, with the replicators' producers on
# them, until their keep-alive finds them dead, in 30-60 s with the default 30 s interval.
#
# Look for: the replicators' reconnections in the brokers' logs, the replication backlog and delay, and whether the
# remote applications receive every message once and in order.

extends: geo-replication.yaml
network:
  impairments:
    replicators-gone:
      from: brokers
      to: remote-brokers
      silentDisconnect: true
      start: 30s
