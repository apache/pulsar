# The brokers' packets to and from the bookies are lost in bursts, 0.5 % of them, for the whole run, in the failover
# cluster, as on a congested or faulty storage network. TCP recovers most losses with a fast retransmission, but a lost
# burst can wait for the retransmission timeout, about 200 ms.
#
# Look for: the publish latency's tail, p99.9 and max, against a run of failover-cluster.yaml alone, the median, and the
# brokers' TCP retransmissions in the report's Network conditions section.

extends: failover-cluster.yaml
network:
  impairments:
    lossy-storage:
      between: [brokers, bookies]
      loss: 0.5%
      lossBurst: 2
