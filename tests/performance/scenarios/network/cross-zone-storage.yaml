# The brokers and the bookies are in different availability zones of a region: 1 ms one way between them, varying by
# up to 0.5 ms, for the whole run, in the failover cluster, whose entries go to three bookies and wait for two. Look
# for: publish latency up by the round trip of a bookie write, about 2 ms, and how much the brokers' batching hides it.

extends: failover-cluster.yaml
network:
  impairments:
    brokers-bookies-cross-zone:
      between: [brokers, bookies]
      delay: 1ms
      jitter: 500us
