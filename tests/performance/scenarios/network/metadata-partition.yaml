# A broker is cut off from the metadata stores for 10 s of the measurement, in the failover cluster, below the metadata
# session's 30 s timeout, as a short network blip to ZooKeeper does. The broker should keep serving its clients. With
# --set network.impairments.broker-1-metadata-cut-off.duration=45s, the session expires; nobody else takes the topics
# unless a client looks them up meanwhile, which metadata-takeover.yaml makes happen.
#
# Look for: whether publishing goes on, and the session and lock events in the broker's log, also when the session
# expires.

extends: failover-cluster.yaml
network:
  impairments:
    broker-1-metadata-cut-off:
      between: [broker-1, metadata]
      partition: true
      start: 30s
      duration: 10s
