# Every broker is cut off from ZooKeeper and the configuration store for 45 s of the measurement, past the 30 s session
# timeout, in the failover cluster, as in a metadata store outage. 20 s into the outage, the consumers' connections are
# reset, so that they look their topics up while the brokers can't reach ZooKeeper, a few seconds before the brokers
# declare their sessions lost: the session watcher does that 25 s after it first finds ZooKeeper unreachable, which it
# checks every 2 s; set reset-applications.start to 65s or later for lookups after that. With the default
# zookeeperSessionExpiredPolicy=reconnect, the brokers should keep serving the topics they own. The clients log at info
# level, so that their reconnections show.
#
# Look for: the publish latency, the clients' lookups and reconnections in their logs, the brokers' sessions being
# reestablished and their locks revalidated afterwards ("Revalidating all the existing locks"), and correct delivery.

extends: failover-cluster.yaml
network:
  impairments:
    metadata-outage:
      between: [brokers, metadata]
      partition: true
      start: 30s
      duration: 45s
    reset-applications:
      from: applications
      to: brokers
      reset: true
      start: 50s
workloads:
  iotTelemetry:
    gateways:
      env:
        PULSAR_CLIENT_LOG_LEVEL: info
    applications:
      env:
        PULSAR_CLIENT_LOG_LEVEL: info
