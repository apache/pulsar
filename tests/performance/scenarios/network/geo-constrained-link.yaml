# The link from the first cluster's brokers to the remote brokers drops to 1 Mbit/s, below what the replication sends,
# for 60 s of the measurement, as a congested link between regions does, with a 100 ms queue at the bottleneck, which
# holds at least 64 full frames: 775 ms at 1 Mbit/s. Set the rate for the base scenario's traffic with --set
# network.impairments.replication-link.rate=<rate>.
#
# Look for: the replication backlog and delay during the limit, how long they take to drain after it, whether the
# replicators time out or reconnect, and whether the remote applications receive every message once and in order.

extends: geo-replication.yaml
network:
  impairments:
    replication-link:
      from: brokers
      to: remote-brokers
      rate: 1mbit
      start: 30s
      duration: 60s
