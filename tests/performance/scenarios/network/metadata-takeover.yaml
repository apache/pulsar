# A broker loses the metadata stores for 90 s of the measurement, in the failover cluster, while it still reaches its
# clients and the bookies, and 40 s in, after its metadata session has expired, the applications' connections are reset,
# so that the consumers look their topics up again. A lookup that reaches the other broker makes it take the topics over
# and fence the isolated broker's ledgers. The isolated broker keeps serving, as the default
# zookeeperSessionExpiredPolicy of reconnect intends, while the gateways' producers stay connected to it. The brokers
# deduplicate, and the producers have no send timeout.
#
# Look for: how long the isolated broker holds its producers after another broker has fenced its ledgers, the publish
# latency until the producers move, the fencing in the brokers' logs, and the duplicates' kinds in the Correctness
# section.

extends: failover-cluster.yaml
network:
  impairments:
    broker-1-metadata-cut-off:
      between: [broker-1, metadata]
      partition: true
      start: 30s
      duration: 90s
    reset-applications:
      from: applications
      to: brokers
      reset: true
      start: 70s
workloads:
  iotTelemetry:
    # Long enough to see the recovery after the metadata stores come back
    measurement:
      seconds: 180
    timeoutSeconds: 360
    gateways:
      env:
        PULSAR_CLIENT_LOG_LEVEL: info
    applications:
      env:
        PULSAR_CLIENT_LOG_LEVEL: info
