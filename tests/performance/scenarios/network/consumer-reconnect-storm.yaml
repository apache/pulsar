# The applications' TCP connections are reset once during the warmup and once 30 s into the measurement, as a load
# balancer or a NAT gateway in front of the consumers that resets its connections does, while the gateways' connections
# stay up. Every pod's client reconnects after its initial backoff of 100 ms, with only 5 % of jitter, so every consumer
# resubscribes at once. The first reset warms up the brokers' code for it, so that the second one measures a warm
# broker. The clients' INFO logs show the reconnections in each workload's pulsar-client.log.txt.
#
# On iot-telemetry-small, 20 applications of 10 pods have 6,000 Key_Shared consumers on one broker. A broker removes a
# closed connection's consumers on the I/O thread that also serves producers, and each removal and addition changes the
# Key_Shared subscription's hash ring. Look for: the publish latency of the untouched producers after each reset,
# against --set workloads.iotTelemetry.applications.podsPerApplication=1, 5 or 10, and the redelivered duplicates.

network:
  impairments:
    reset-applications-warmup:
      from: applications
      to: brokers
      reset: true
      anchor: run
      start: 12s
    reset-applications:
      from: applications
      to: brokers
      reset: true
      start: 30s
workloads:
  iotTelemetry:
    applications:
      env:
        PULSAR_CLIENT_LOG_LEVEL: info
