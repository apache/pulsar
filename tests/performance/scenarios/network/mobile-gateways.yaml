# The gateways reach the cluster over a cellular network: 50 ms one way, varying by up to 20 ms, and 1 % of the packets
# lost, in bursts of 2 packets on average, for the whole run. The applications are in the cluster's region.
#
# Look for: the publish latency's tail from the retransmissions, against a run without the loss, whether the producers
# keep the rate, and reconnections.

network:
  impairments:
    gateways-cellular:
      between: [gateways, brokers]
      delay: 50ms
      jitter: 20ms
      loss: 1%
      lossBurst: 2
workloads:
  iotTelemetry:
    gateways:
      producer:
        precreate: true
