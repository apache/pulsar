# A cluster that can lose a broker or a bookie, for the fault overlays: two brokers, both in the workloads' service URL
# so that the clients can look topics up on either, and four bookies with an ensemble, a write quorum and an ack quorum
# of 3, 3 and 2: an entry is acknowledged by the two fastest of its three bookies, and a fourth bookie can replace a
# failed one. The fault overlays extend it; the memory of each container comes from the base scenario.

cluster:
  brokers:
    replicas: 2
    bootstrap: all
    env:
      managedLedgerDefaultEnsembleSize: "3"
      managedLedgerDefaultWriteQuorum: "3"
      managedLedgerDefaultAckQuorum: "2"
  bookies:
    replicas: 4
