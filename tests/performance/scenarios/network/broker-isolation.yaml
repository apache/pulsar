# A broker loses its network for 45 s of the measurement, in the failover cluster: no clients, no other broker, no
# bookies and no metadata store, beyond the metadata session's 30 s timeout, as a broker's host that drops off the
# network does. Its metadata session is lost, and the other broker can take its topics over when the clients look them
# up again, while the bookies fence the isolated broker's ledgers. Clients notice a silent connection only through their
# keep-alive, in 30-60 s with the default 30 s interval, which overlaps the 45 s outage: --set
# network.impairments.broker-1-isolated.duration=90s separates the failover from the recovery.
#
# Look for: when the topics move to the other broker, the fencing, the clients' reconnections, ordering and duplicates.

extends: failover-cluster.yaml
network:
  impairments:
    broker-1-isolated:
      between: [broker-1, [clients, broker-0, bookies, metadata]]
      partition: true
      start: 30s
      duration: 45s
