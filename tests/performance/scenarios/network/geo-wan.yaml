# The link between the two regions of a geo-replicated pair is a wide-area network: 40 ms one way, a round trip of 80
# ms, varying by up to 4 ms, between every container on each side, for the whole run; the configuration store is on the
# first cluster's side.
#
# Look for: the replication delay and backlog in replication-stats.csv, and the remote applications' publish-to-consume
# latency, against a run of network/geo-replication: how many round trips the replication takes per message.

extends: geo-replication.yaml
network:
  impairments:
    regions-wan:
      between: [local-region, remote-region]
      delay: 40ms
      jitter: 4ms
