# Every bookie is cut off from ZooKeeper for 45 s of the measurement, past the session timeout, in the failover cluster,
# while the brokers still reach the bookies and ZooKeeper; the consumers' connections are reset 20 s in, so that the
# consumers reconnect, look their topics up and subscribe again. Writing to and reading from a bookie doesn't need
# ZooKeeper, so the bookies should keep serving the brokers. Pulsar's default configuration runs the AutoRecovery daemon
# inside each bookie (autoRecoveryDaemonEnabled=true), which reacts to the lost metadata session; compare with --set
# cluster.bookies.env.autoRecoveryDaemonEnabled=false. The test image doesn't restart a bookie that exits.
#
# Look for: whether the bookies stay up, in their logs in the checkout's build/container-logs, the brokers' failures to
# create ledgers (BKNotEnoughBookiesException), and whether publishing goes on and every message is delivered.

extends: failover-cluster.yaml
network:
  impairments:
    bookie-metadata-outage:
      between: [bookies, zookeeper]
      partition: true
      start: 30s
      duration: 45s
    reset-applications:
      from: applications
      to: brokers
      reset: true
      start: 50s
