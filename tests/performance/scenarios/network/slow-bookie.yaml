# One bookie is on a degraded link: 20 ms one way between it and the brokers, for the whole run, in the failover cluster
# with an ack quorum of 2 of 3, where every entry can be acknowledged by the two other bookies first.
#
# Look for: whether the publish latency changes; compare with --set cluster.brokers.env.managedLedgerDefaultAckQuorum=3,
# where every entry waits for the slow bookie, and with a high-rate scenario, where the slow bookie's queue grows.

extends: failover-cluster.yaml
network:
  impairments:
    slow-bookie-0:
      between: [brokers, bookie-0]
      delay: 20ms
