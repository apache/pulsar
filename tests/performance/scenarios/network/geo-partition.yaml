# The brokers of the two clusters can't reach each other for 60 s of the measurement, as when the link between two
# regions fails, while each cluster and its clients keep working: the replication stops, and the topics' replication
# backlog grows by every message published meanwhile. The connections aren't reset: both brokers close them after their
# keep-alive timeout, and the replicators reconnect and resend their pending messages.
#
# Look for: whether the replicators reconnect after the partition, how long the backlog takes to drain, and whether the
# remote applications receive every message once and in order. When they miss messages, compare the remote topics'
# published-message counters in remote-topic-stats.csv with the source topics' in topic-stats.csv, and check the remote
# subscriptions' backlog, to tell messages that the remote topics lack from messages that weren't delivered.

extends: geo-replication.yaml
network:
  impairments:
    brokers-cut-off:
      between: [brokers, remote-brokers]
      partition: true
      start: 30s
      duration: 60s
