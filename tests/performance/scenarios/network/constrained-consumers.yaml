# The brokers' traffic to the applications is limited to 5 Mbit/s, about half of what they receive, for 60 s of the
# measurement, as consumers behind a congested link: the applications fall behind and a backlog builds, while the
# producers' path isn't touched. The messages dispatched to the slow consumers and not yet acknowledged stay in the
# broker's memory, on top of the Key_Shared consumers' state, and the backlog drains at a high rate after the limit, on
# a host whose CPUs the broker shares with the clients and the bookies. Set the rate for the base scenario's traffic,
# such as --set network.impairments.applications-downlink.rate=2mbit, and the broker's memory with a memory
# configuration, such as configs/iot-telemetry-medium-mem.
#
# Look for: the broker's heap, the publish latency of the untouched producers during the limit and the drain, the
# backlog and how fast it drains, and the redeliveries if the broker restarts, such as when it runs out of heap.

network:
  impairments:
    applications-downlink:
      from: brokers
      to: applications
      rate: 5mbit
      start: 30s
      duration: 60s
