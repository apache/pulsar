# The clients' TCP connections to the brokers are reset during the measurement, as a load balancer or a NAT gateway that
# resets its connections does: the gateways' at 20 s, 50 s and 80 s, and the applications' at 35 s. The clients
# reconnect after 100 ms. A reset of the applications' connections makes every consumer resubscribe at once, as
# consumer-reconnect-storm.yaml does on its own. A NAT gateway that forgets its connections without resetting them is a
# partition instead, which the clients notice through their keep-alive.
#
# Look for: the publish latency spike of each reset, also of the producers that the applications' reset doesn't touch,
# reconnections, redelivered duplicates and ordering.

network:
  impairments:
    reset-gateways-1:
      from: gateways
      to: brokers
      reset: true
      start: 20s
    reset-applications:
      from: applications
      to: brokers
      reset: true
      start: 35s
    reset-gateways-2:
      from: gateways
      to: brokers
      reset: true
      start: 50s
    reset-gateways-3:
      from: gateways
      to: brokers
      reset: true
      start: 80s
