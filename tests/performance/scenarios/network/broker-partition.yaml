# A broker is cut off from the clients for 30 s of the measurement, in the failover cluster, while it still reaches the
# other broker, the bookies and ZooKeeper, as a load balancer or a firewall between the clients and one broker would do.
# The broker keeps its topics, a gray failure: the clients wait for it rather than move, until the connections are found
# dead or come back.
#
# Look for: how long its topics' publishes stall beyond the partition, whether the other broker's topics go on, the
# duplicates, and how many pending messages the gateways hold: at about 400 messages a second to the cut-off broker, the
# gateways' shared limit of 20,000 outstanding messages fills after about 50 s, and then the gateways stop sending to
# every topic, which is the workload's single send loop, not Pulsar.

extends: failover-cluster.yaml
network:
  impairments:
    broker-1-clients-cut-off:
      between: [clients, broker-1]
      partition: true
      start: 30s
      duration: 30s
