# Consumers joining a live stream: the gateways publish at the high-rate scenario's 30,000 msg/s, and 4 of the 5
# applications join after the measurement starts, 2 of them at the same time. Each late application had its
# subscription from the start, so it catches up on the backlog that built up until it joined, while the gateways keep
# publishing; the report's Catch-up section shows how long each took. The 2 applications that join together read the
# same backlog, so the entries that the first one reads from storage can be served to the other from the broker's
# entry cache. The measurement is 120 s, so the last application joins halfway through it.
extends: iot-telemetry-high-rate.yaml
workloads:
  iotTelemetry:
    measurement:
      messages: 3600000
    applications:
      joinSeconds: [0, 20, 20, 40, 60]
