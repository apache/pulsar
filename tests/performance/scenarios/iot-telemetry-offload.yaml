# Catch-up reads from tiered storage: the brokers offload each ledger to an S3-compatible SeaweedFS as soon as it rolls
# over, and delete it from BookKeeper at once; with the brokers' default managedLedgerDataReadPriority,
# tiered-storage-first, subscriptions that fall behind read their backlog from the tiered storage. The gateways publish 100,000 unbatched 1 KiB messages to one topic at 10,000 msg/s, into ledgers of 25,000
# entries. Six applications of one pod each keep their subscriptions without consuming, and join 30 s after the
# measurement starts, when the gateways have finished and the brokers have offloaded the closed ledgers. Before they
# join, the launcher moves the subscriptions' positions 10,240 messages apart, from 0 to 51,200, which puts several
# of them in each offloaded ledger, and unloads the topic, so that the applications read from a topic loaded anew.
# The brokers reach the storage with 10 ms of delay each way, as an object store in the same region answers. The
# report's Offloading section shows how many ledgers had been offloaded when the applications joined, and its Catch-up
# section how long each took to receive its backlog: the time to read it from the tiered storage.
#
# Compare tiered storage implementations, or Pulsar releases, with -Pperformance.clusterPulsarImage: with
# -Pperformance.installOffloaders=true, the test image built on a 4.x release image adds the release's offloader, which
# the release image doesn't have. Set the broker settings that shape the reads explicitly in cluster.brokers.env, such
# as dispatcherMaxReadBatchSize and s3ManagedLedgerOffloadReadBufferSizeInBytes, so that the releases' defaults of them
# don't decide the result.
extends: iot-telemetry-base.yaml
cluster:
  brokers:
    env:
      # A ledger rolls over at 25,000 entries, without the 60-minute minimum between rollovers of
      # configs/cluster-base.yaml
      managedLedgerMaxEntriesPerLedger: "25000"
      managedLedgerMinLedgerRolloverTimeMinutes: "0"
# The offloads' storage and the namespace's offload policies: offload every ledger as it rolls over, and delete it
# from BookKeeper at once
offload:
  namespace: public/default
  thresholdBytes: 0
  deletionLagMillis: 0
network:
  impairments:
    offload-storage-latency:
      between: [brokers, offload-storage]
      delay: 10ms
workloads:
  iotTelemetry:
    # No warmup: the applications that join later don't take part in it
    warmup:
      seconds: 0
    measurement:
      seconds: 10
    # The applications read their backlog from the tiered storage after they join at 30 s, which can take minutes
    timeoutSeconds: 1500
    rate: 10000
    payload:
      size: 1024
    devices:
      count: 1000
    gateways:
      producer:
        # One message per entry, so that the positions are moved by messages
        batchingEnabled: false
    topics:
      count: 1
    applications:
      count: 6
      podsPerApplication: 1
      joinSeconds: [30, 30, 30, 30, 30, 30]
      skipMessages: [0, 10240, 20480, 30720, 40960, 51200]
      unloadBeforeJoin: true
