# The alert fan-out of iot-alerts-fanout.yaml at the maximum rate: the gateways publish two million unbatched alerts
# as fast as the cluster takes them, with up to 50,000 in flight, so that every alert is an entry of its own that the
# broker deduplicates, persists and dispatches to the 50 Shared subscriptions. It measures the most alerts that one
# topic fans out, and the broker's limit in the deduplication, Shared dispatch and acknowledgment paths.
extends: iot-alerts-fanout.yaml
workloads:
  iotTelemetry:
    rate: 0
    warmup:
      seconds: 0
      messages: 200000
      rounds: 1
      roundDelaySeconds: 0
    measurement:
      messages: 2000000
    timeoutSeconds: 600
    gateways:
      producer:
        maxOutstanding: 50000
        batchingEnabled: false
