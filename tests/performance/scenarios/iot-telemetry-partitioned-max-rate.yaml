# The capacity of consumers of a partitioned topic: the gateways publish to one topic of 16 partitions without a rate
# limit, in batches, and two applications of two pods read it on Key_Shared subscriptions, each pod's consumer a
# multi-topics consumer of the 16 partitions. The consumers' delivery is the limit to watch: a change that serializes
# the partitions' consumers on fewer threads would show here first. iot-telemetry-partitioned.yaml is the moderate
# rate case.
extends: iot-telemetry-high-rate.yaml
workloads:
  iotTelemetry:
    rate: 0
    measurement:
      messages: 6000000
    topics:
      count: 1
      partitions: 16
      prefix: persistent://public/default/iot-fleet-telemetry-
    applications:
      count: 2
      podsPerApplication: 2
      subscriptionPrefix: fleet-analytics-
