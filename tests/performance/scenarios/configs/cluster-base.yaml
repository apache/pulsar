# The Pulsar cluster that the memory configurations share: one broker and three bookies, with the benchmark's broker
# and bookie settings. Three bookies spread the load of many topics' ledgers, and of the new ledgers that rollovers
# create, instead of putting it all on one bookie. The cluster-*-mem.yaml files extend it, and set the memory and, for
# less memory, fewer bookies.
cluster:
  brokers:
    replicas: 1
    env:
      brokerDeduplicationEnabled: "true"
      # Keep storage-maintenance boundaries outside ordinary warmup and measurement windows.
      # These are benchmark settings, not production sizing recommendations.
      managedLedgerMaxEntriesPerLedger: "100000000"
      managedLedgerMinLedgerRolloverTimeMinutes: "60"
      managedLedgerMaxLedgerRolloverTimeMinutes: "1440"
      managedLedgerMaxSizePerLedgerMbytes: "16384"
      managedLedgerCursorMaxEntriesPerLedger: "100000000"
      managedLedgerCursorRolloverTimeInSeconds: "86400"
  bookies:
    replicas: 3
    env:
      # The containers are ephemeral, so postpone reclamation and compaction until after the run.
      journalMaxSizeMB: "8192"
      gcWaitTime: "86400000"
      gcOverreplicatedLedgerWaitTime: "86400000"
      minorCompactionInterval: "-1"
      majorCompactionInterval: "-1"
