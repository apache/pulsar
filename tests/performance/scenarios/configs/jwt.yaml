# The brokers authenticate every client with a JSON Web Token, as Pulsar's token authentication does. The launcher
# creates the keys and the tokens for each run, as the Pulsar Helm chart's JWT secret job does: the gateways and the
# applications authenticate as iot-workload, and the brokers' own clients and the launcher's admin requests as admin,
# the super-user. The brokers don't authorize the roles. For runs that measure what authentication costs, compared
# with the same scenario without it; with configs/tls too, the tokens go over TLS, as in most deployments.
# signatureAlgorithm HS256 signs the tokens with a secret key in place of RS256's RSA key pair. Add it with the
# launcher's --extends option.
cluster:
  jwt:
    enabled: true
    signatureAlgorithm: RS256
