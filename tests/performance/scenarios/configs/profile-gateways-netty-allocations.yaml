# Profiles the gateways' Pulsar clients as configs/profile-gateways does, and also records the events of Netty's
# buffer allocators with JDK Flight Recorder, from tests/performance/jfr/netty-allocations.jfc: every buffer
# allocation, reallocation and free, and every chunk allocation and free. nettyAllocationsReport summarizes them in
# the profile report's Netty allocator events section, by size, pooled or one-off memory and thread pool. The buffer
# events are recorded for every buffer, so they add a heavy overhead to the gateways' Pulsar clients and make the
# recording much larger: in the max-rate scenario, about 2.5 events of each kind per message, and a broker recording
# of 1 GB instead of 10 MB. Prefer a short measurement, and compare throughput and latency only between runs that
# record the same events. Netty 4.1, which Pulsar 4.x uses, has no such events. Add it to a scenario with the
# launcher's --extends configs/profile-gateways-netty-allocations option, in place of configs/profile-gateways, and
# run the scenario with the profile task.
extends: profile-gateways.yaml
profiling:
  gateways:
    jfrConfigurations: [profile, netty-allocations.jfc]
    nettyAllocationsReport: true
