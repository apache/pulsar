# Profiles the broker as configs/profile-broker does, and also records every Netty buffer allocation and free with JDK
# Flight Recorder (io.netty.AllocateBuffer and io.netty.FreeBuffer, from tests/performance/jfr/netty-allocations.jfc),
# which the profile report's Netty allocator events section breaks down by size, pooled or one-off memory and thread
# pool. There is an event for every buffer, so it adds overhead to the broker and makes the recording much larger: in
# the max-rate scenario, about 2.5 events of each kind per message, and a broker recording of 1 GB instead of 10 MB.
# Prefer a short measurement, and compare throughput and latency only between runs that record the same events. Add it
# to a scenario with the launcher's --extends configs/profile-broker-netty-allocations option, and run the scenario
# with the profile task.
extends: profile-broker.yaml
profiling:
  broker:
    jfrConfigurations: [profile, pulsar.jfc, netty-allocations.jfc]
