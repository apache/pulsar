# The high-memory configuration of the IoT telemetry scenarios, for the high-rate scenarios: the cluster of
# cluster-high-mem.yaml, and the memory of the gateways' and the applications' containers. Recommended memory available
# to Docker: about 14 GB.
extends: cluster-high-mem.yaml
workloads:
  iotTelemetry:
    gateways:
      # The environment of the gateways' container. PULSAR_MEM sets the JVM's heap and direct memory.
      env:
        PULSAR_MEM: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch
    applications:
      # The environment of the applications' container. PULSAR_MEM sets the JVM's heap and direct memory, which every
      # application shares. The heap is the medium-memory configuration's, which iot-telemetry.yaml's 2,000 pods need.
      env:
        PULSAR_MEM: -Xms1536m -Xmx1536m -XX:MaxDirectMemorySize=256m -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch
