# The low-memory configuration of the IoT telemetry scenarios: the cluster of cluster-low-mem.yaml, and the memory of
# the gateways' and the applications' containers. Recommended memory available to Docker: about 3 GB. It is for
# checking that a scenario works on a small host, and isn't meant for profiling.
extends: cluster-low-mem.yaml
workloads:
  iotTelemetry:
    gateways:
      # The environment of the gateways' container. PULSAR_MEM sets the JVM's heap and direct memory.
      env:
        PULSAR_MEM: -Xmx512m -XX:MaxDirectMemorySize=256m
    applications:
      # The environment of the applications' container. PULSAR_MEM sets the JVM's heap and direct memory, which every
      # application shares. The heap is sized for iot-telemetry-small.yaml's 200 pods; iot-telemetry.yaml's 2,000 pods
      # run out of it.
      env:
        PULSAR_MEM: -Xmx512m -XX:MaxDirectMemorySize=256m
