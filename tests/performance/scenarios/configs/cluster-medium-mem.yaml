# The cluster of the medium-memory configuration, iot-telemetry-medium-mem.yaml, which the IoT telemetry scenarios use
# by default: two bookies.
extends: cluster-base.yaml
cluster:
  brokers:
    env:
      PULSAR_MEM: -Xms2g -Xmx2g -XX:MaxDirectMemorySize=1g -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch
  bookies:
    replicas: 2
    env:
      PULSAR_MEM: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch
