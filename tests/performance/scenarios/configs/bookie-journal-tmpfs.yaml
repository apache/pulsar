# Puts each bookie's journal on a tmpfs of 2 GB, so that it isn't written to the disk. The test cluster doesn't sync
# the journal, so this doesn't change what a crash would lose; it takes the journal's writes off the disk, which then
# only has the ledger storage's. For runs whose limit is the disk's write bandwidth, such as the max-rate scenario with
# large messages. The launcher sets the journal's files to 256 MB without backups, so that a bookie's journal takes
# about 512 MB of memory. Add it with the launcher's --extends option.
cluster:
  bookies:
    journalTmpfs: 2g
