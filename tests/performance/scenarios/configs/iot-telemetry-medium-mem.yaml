# The medium-memory configuration of the IoT telemetry scenarios, their default, which iot-telemetry-base.yaml
# extends: the cluster of cluster-medium-mem.yaml, and the memory of the gateways' and the applications' containers.
# Recommended memory available to Docker: about 11 GB.
extends: cluster-medium-mem.yaml
workloads:
  iotTelemetry:
    gateways:
      # The environment of the gateways' container. PULSAR_MEM sets the JVM's heap and direct memory.
      env:
        PULSAR_MEM: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch
    applications:
      # The environment of the applications' container. PULSAR_MEM sets the JVM's heap and direct memory, which every
      # application shares. The heap is about twice the full topology's live heap: iot-telemetry.yaml's 2,000 pods
      # keep up to about 770 MiB live, and run out of a 512 MiB heap while they open.
      env:
        PULSAR_MEM: -Xms1536m -Xmx1536m -XX:MaxDirectMemorySize=256m -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch
