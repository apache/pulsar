# The gateways and the applications connect to the brokers with TLS. The launcher creates a CA for each run and a
# certificate of the brokers that it signs, with the brokers' names, so that the clients verify the brokers' names as
# they do by default; the clients don't authenticate with certificates of their own. The proxy, geo-replication and
# the launcher's admin requests keep the plain ports. For runs that measure what TLS costs the brokers' and the
# clients' I/O threads, compared with the same scenario without it. keyAlgorithm EC uses ECDSA P-256 keys in place of
# 2048-bit RSA keys, whose handshakes cost the brokers less CPU. Add it with the launcher's --extends option.
cluster:
  tls:
    enabled: true
    keyAlgorithm: RSA
