# Keeps the 20-way fanout, 30 topics and rate while scaling gateway and pod connections by 10. It uses the low-memory
# configuration, configs/iot-telemetry-low-mem.yaml: recommended memory available to Docker about 3 GB, and not meant
# for profiling.
extends: [iot-telemetry.yaml, configs/iot-telemetry-low-mem.yaml]
workloads:
  iotTelemetry:
    devices:
      count: 100000
    gateways:
      count: 10
      producer:
        ioThreads: 4
        listenerThreads: 8
    applications:
      podsPerApplication: 10
      client:
        ioThreads: 4
        listenerThreads: 8
