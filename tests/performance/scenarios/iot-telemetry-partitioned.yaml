# Fleet telemetry on partitioned topics: the gateways publish three telemetry streams, each a topic of 16 partitions,
# at 5,000 msg/s in all, and 10 analytics applications of 20 pods read them on Key_Shared subscriptions. Each pod
# subscribes to the three partitioned topics, so its consumer is a multi-topics consumer of 48 partitions, each of
# which receives a few messages per second: the clients' cost per message at a moderate rate, as most deployments of
# partitioned topics run. iot-telemetry-partitioned-max-rate.yaml measures the same consumers' capacity.
extends: [iot-telemetry-base.yaml, configs/iot-telemetry-high-mem.yaml]
workloads:
  iotTelemetry:
    rate: 5000
    payload:
      size: 256
    devices:
      count: 300000
    gateways:
      count: 50
      producer:
        precreate: true
    topics:
      count: 3
      partitions: 16
      prefix: persistent://public/default/iot-fleet-telemetry-
    applications:
      count: 10
      podsPerApplication: 20
      subscriptionPrefix: fleet-analytics-
