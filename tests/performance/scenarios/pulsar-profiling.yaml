# Pass this file with PULSAR_PROFILING_CONFIG=/path/to/pulsar-profiling.yaml.
# Values not present here keep the harness defaults.
cluster:
  numBrokers: 1
  numBookies: 3
  numProxies: 0
  brokerMemory: "-Xms2g -Xmx2g -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch"
  bookkeeperMemory: "-Xmx1g -XX:+UseTransparentHugePages -XX:+AlwaysPreTouch"
  brokerEnvs:
    managedLedgerDefaultEnsembleSize: "1"
    managedLedgerDefaultWriteQuorum: "1"
    managedLedgerDefaultAckQuorum: "1"
  bookkeeperEnvs:
    dbStorage_writeCacheMaxSizeMb: "64"
    dbStorage_readAheadCacheMaxSizeMb: "96"
load:
  numberOfMessages: 20000000
  produceMemoryLimit: 200M
  consumeMemoryLimit: 200M
  produceRate: 2147483647
  messageSize: 128
  batchingEnabled: false
  maxOutstanding: 20000
  statsIntervalSeconds: 10
  # Used only by produce-v4/consume-v4. A value of 500 creates up to 500 clients.
  producerCount: 1
  consumerCount: 1
  producerIoThreads: 1
  consumerIoThreads: 1
  subscriptionType: Shared
  receiverQueueSize: 50000
  timeoutSeconds: 180
  isolatedProducers: 0
  isolatedConsumers: 0
profiling:
  # Empty options leave the client unprofiled. Broker options use -Pinttest.asyncprofiler.opts.
  producerOptions: ""
  consumerOptions: ""
output:
  directory: build/pulsar-profiling
