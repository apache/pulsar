# The launcher variant of key-shared-500x20.yaml: 500 producer connections feed one topic as fast as possible
# and one application consumes it through a twenty-member Key_Shared subscription, unbatched. Like
# key-shared-500x20.yaml, ledgers keep a single copy: this is a broker dispatch experiment, not durable capacity
# guidance.
extends: iot-telemetry-high-rate.yaml
cluster:
  brokerEnvs:
    managedLedgerDefaultEnsembleSize: "1"
    managedLedgerDefaultWriteQuorum: "1"
    managedLedgerDefaultAckQuorum: "1"
workloads:
  iotTelemetry:
    numberOfMessages: 4000000
    payloadBytes: 128
    batchingEnabled: false
    applicationCount: 1
    clientsPerApplication: 20
