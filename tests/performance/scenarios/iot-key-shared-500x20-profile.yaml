extends: iot-key-shared-500x20.yaml
profiling:
  # async-profiler options for each profiled JVM, recorded through the jonoffcpu agent. No wall-clock or lock
  # event: CPU and allocation data share one JFR recording, and waiting time comes from the kernel instead.
  brokerOptions: event=cpu,interval=10ms,alloc=2m,jfrsync=profile
  producerOptions: event=cpu,interval=10ms,alloc=2m,jfrsync=profile
  consumerOptions: ""
  # The jonoffcpu sampling policy shared by every profiled JVM. Only intervals where the thread blocked are
  # recorded, not those where it was runnable but had no CPU. Waits below 100 µs are dropped as context-switch
  # noise; every wait of 10 ms or longer is recorded, and shorter ones in proportion to their length, so the long
  # waits are never missed and the short ones cannot swamp the capture. A broker run records about 300 k
  # intervals this way, under a fifth of them below 1 ms, and correlates in well under 100 MB.
  offCpu:
    reasons: [blocked]
    minOffCpuMicros: 100
    admission:
      policy: proportional
      recordAllAboveMicros: 10000
  retainOriginalRecording: true
  createMeasurementRecording: true
output:
  directory: build/performance/iot-key-shared-500x20-profile
