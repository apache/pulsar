# Alarm processing with retries and a dead letter topic: a building-management platform's gateways publish the alarms
# of 100,000 devices to four topics. Four applications, such as notifications by SMS, ticketing, escalation and an
# audit log, each process every alarm through a Shared subscription of their own with four worker pods. The workers
# call downstream services that fail now and then: the first and second attempts of 5 % of the alarms fail, and the
# workers retry them through their application's retry topic, which redelivers them after 2 seconds, as
# reconsumeLater does. Malformed alarms from misconfigured devices, 0.1 %, fail every attempt and go to the
# application's dead letter topic after 3 retries, where the application also reads them, for its operators. It
# measures the cost of the retries: the retry topics' delayed deliveries and the dead letter topics. It checks that
# each alarm is processed once or dead-lettered once, and that exactly the malformed alarms are dead-lettered. With
# --set workloads.iotTelemetry.behaviors.processingFailures.retry=negativeAck and
# --set workloads.iotTelemetry.gateways.producer.batchingEnabled=false, the workers retry by negative acknowledgment
# instead, which the broker redelivers, and which needs unbatched messages.
extends: iot-telemetry-base.yaml
workloads:
  iotTelemetry:
    rate: 5000
    payload:
      size: 256
    measurement:
      seconds: 180
    timeoutSeconds: 360
    devices:
      count: 100000
    gateways:
      count: 10
      producer:
        precreate: true
    topics:
      count: 4
      prefix: persistent://public/default/iot-alarms-
    applications:
      count: 4
      podsPerApplication: 4
      subscriptionPrefix: alarm-worker-
      subscriptionType: Shared
    behaviors:
      processingFailures:
        fraction: 0.05
        poisonFraction: 0.001
        retry: retryTopic
        retryDelayMillis: 2000
        maxRedeliveries: 3
