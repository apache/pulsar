# Full representative topology. Start with iot-telemetry-local.yaml on one development host.
cluster:
  brokers: 1
  bookies: 3
  brokerEnvs:
    brokerDeduplicationEnabled: "true"
    PULSAR_MEM: -Xms2g -Xmx2g -XX:MaxDirectMemorySize=2g
  bookkeeperEnvs:
    PULSAR_MEM: -Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m
workloads:
  iotTelemetry:
    serviceUrl: pulsar://iot-pulsar-broker-0:6650
    topicPrefix: persistent://public/default/iot-telemetry-
    subscriptionPrefix: iot-application-
    durationSeconds: 120
    rate: 1000
    numberOfMessages: 0
    payloadBytes: 64
    deviceCount: 300000
    gatewayCount: 100
    topicCount: 30
    applicationCount: 20
    clientsPerApplication: 100
    ioThreads: 8
    listenerThreads: 16
    maxOutstanding: 20000
    batchingEnabled: true
    precreateProducers: false
    consumerTimeoutSeconds: 240
    clientRestartIntervalSeconds: 0
    clientRestartFraction: 0.0
output:
  directory: build/performance/iot-telemetry
